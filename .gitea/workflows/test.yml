name: Test

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-amd64
    timeout-minutes: 10

    strategy:
      matrix:
        uv_resolution: ["highest", "lowest-direct"]

    env:
      UV_RESOLUTION: ${{ matrix.uv_resolution }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies
        run: uv sync

      - name: Check TMDB proxy
        run: test -n "$TMDB_API_URL"
        env:
          TMDB_API_URL: ${{ vars.TMDB_API_URL }}

      - name: Test with pytest
        run: |
          uv run pytest --verbose
        env:
          TMDB_API_URL: ${{ vars.TMDB_API_URL }}
