name: Tasks

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-slim
    timeout-minutes: 5

    outputs:
      ok: ${{ steps.lag.outputs.ok }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Install dependencies
        run: uv sync

      - name: Check Wikidata replication lag
        id: lag
        run: uv run wikidata_maxlag.py

  rdf-patch:
    runs-on: ubuntu-24.04
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.ok == 'true' }}
    concurrency: rdf_patch_${{ matrix.script }}

    strategy:
      fail-fast: false
      matrix:
        script:
          - "wd_opencritic"
          - "wd_tmdb"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Install dependencies
        run: uv sync

      - name: Run script
        run: |
          set -o pipefail
          uv run "$SCRIPT.py" | tee output.ttl
        env:
          SCRIPT: ${{ matrix.script }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          WIKIDATA_USERNAME: ${{ secrets.WIKIDATA_USERNAME }}

      - name: Process RDF statements
        run: |
          uv run wikidata-rdf-patch <output.ttl
        env:
          WIKIDATA_USERNAME: ${{ secrets.WIKIDATA_USERNAME }}
          WIKIDATA_PASSWORD: ${{ secrets.WIKIDATA_PASSWORD }}
          WIKIDATA_USER_AGENT: "Josh404Bot/1.0 (User:Josh404Bot)"
          WIKIDATA_BLOCKLIST_URL: "https://www.wikidata.org/wiki/User:Josh404Bot/Blocklist"
          WIKIDATA_MIN_TIME_BETWEEN_EDITS: 5
