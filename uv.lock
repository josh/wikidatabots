dependencies = [
    { name = "backoff" },
    { name = "polars" },
    { name = "requests" },
    { name = "tqdm" },
]

[package.dev-dependencies]
dev = [
    { name = "hypothesis" },
    { name = "pytest" },
    { name = "ruff" },
    { name = "ty" },
    { name = "types-requests" },
    { name = "types-tqdm" },
    { name = "vulture" },
]

[package.metadata]
requires-dist = [
    { name = "backoff", specifier = ">=2.2.1,<3" },
    { name = "polars", specifier = ">=1.31,<3" },
    { name = "requests", specifier = ">=2.32,<3" },
    { name = "tqdm", specifier = ">=4.67,<5" },
]

[package.metadata.requires-dev]
dev = [
    { name = "hypothesis", specifier = ">=6.135,<7" },
    { name = "pytest", specifier = ">=8.4,<10" },
    { name = "ruff", specifier = ">=0.12,<2" },
    { name = "ty", specifier = ">=0.0.91,<0.1" },
    { name = "types-requests", specifier = ">=2.32,<3" },
    { name = "types-tqdm", specifier = ">=4.67,<5" },
    { name = "vulture", specifier = ">=2.14,<3" },
]
